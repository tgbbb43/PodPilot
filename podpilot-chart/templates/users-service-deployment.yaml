apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-service
  template:
    metadata:
      labels:
        app: users-service
    spec:
      containers:
        - name: users-service
          image: {{ .Values.usersService.image }}
          imagePullPolicy: Never
          ports:
            - containerPort: {{ .Values.usersService.port }}
          env:
            - name: PORT
              value: "{{ .Values.usersService.port }}"
            - name: MONGO_URI
              value: "mongodb://mongodb:{{ .Values.mongodb.port }}/users"
            - name: JWT_SECRET
              value: "{{ .Values.usersService.jwtSecret }}"
