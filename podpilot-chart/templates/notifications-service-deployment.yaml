apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications-service
  template:
    metadata:
      labels:
        app: notifications-service
    spec:
      containers:
        - name: notifications-service
          image: "{{ .Values.notificationsService.image }}:{{ .Values.notificationsService.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.notificationsService.port }}
          env:
            - name: PORT
              value: "{{ .Values.notificationsService.port }}"
            - name: MONGO_URI
              value: "mongodb://mongodb:{{ .Values.mongodb.port }}/notifications"
