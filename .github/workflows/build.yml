name: Build and Push Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push users-service
        uses: docker/build-push-action@v5
        with:
          context: ./users-service
          push: true
          tags: |
            eli9476/podpilot-users-service:latest
            eli9476/podpilot-users-service:${{ github.sha }}

      - name: Build and push tasks-service
        uses: docker/build-push-action@v5
        with:
          context: ./tasks-service
          push: true
          tags: |
            eli9476/podpilot-tasks-service:latest
            eli9476/podpilot-tasks-service:${{ github.sha }}

      - name: Build and push notifications-service
        uses: docker/build-push-action@v5
        with:
          context: ./notifications-service
          push: true
          tags: |
            eli9476/podpilot-notifications-service:latest
            eli9476/podpilot-notifications-service:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            eli9476/podpilot-frontend:latest
            eli9476/podpilot-frontend:${{ github.sha }}
